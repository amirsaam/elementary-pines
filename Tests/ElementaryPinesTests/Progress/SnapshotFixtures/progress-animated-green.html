<div x-data="{
        progress: 0,
        progressInterval: null,
    }" x-init="
        progressInterval = setInterval(() => {
            progress = progress + 1;
            if (progress >= 100) {
                clearInterval(progressInterval);
            }
        }, 100);
    " class="relative w-full h-3 overflow-hidden rounded-full bg-green-200"><span x-bind:style="'width:' + progress + '%'" class="absolute left-0 w-24 h-full duration-300 ease-linear bg-green-600" x-cloak></span></div>
