<div class="flex min-h-[370px] justify-center w-full max-w-xl items-start" x-data="{
commandItems: [{ title: 'New', value: 'new', icon: '<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; fill=&quot;none&quot; viewBox=&quot;0 0 24 24&quot; stroke-width=&quot;1.5&quot; stroke=&quot;currentColor&quot; class=&quot;w-4 h-4 mr-2&quot;><path d=&quot;M12 4.5v15m7.5-7.5h-15&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; /></svg>', default: true, category: '', right: null, disabled: false, action: null }],
commandItemsFiltered: [],
commandItemActive: null,
commandItemSelected: null,
commandId: $id('command'),
commandSearch: '',
commandSearchIsEmpty(){ return this.commandSearch.length == 0; },
commandItemIsActive(item){ return this.commandItemActive &amp;&amp; this.commandItemActive.value == item.value; },
commandItemActiveNext(){ let index = this.commandItemsFiltered.indexOf(this.commandItemActive); if (index < this.commandItemsFiltered.length - 1) { this.commandItemActive = this.commandItemsFiltered[index + 1]; this.commandScrollToActiveItem(); } },
commandItemActivePrevious(){ let index = this.commandItemsFiltered.indexOf(this.commandItemActive); if (index > 0) { this.commandItemActive = this.commandItemsFiltered[index - 1]; this.commandScrollToActiveItem(); } },
commandScrollToActiveItem(){ if (this.commandItemActive) { let el = document.getElementById(this.commandItemActive.value + '-' + this.commandId); if (!el) { return; } let newScrollPos = (el.offsetTop + el.offsetHeight) - this.$refs.commandItemsList.offsetHeight; this.$refs.commandItemsList.scrollTop = newScrollPos > 0 ? newScrollPos : 0; } },
commandSearchItems(){ if (!this.commandSearchIsEmpty()) { let term = this.commandSearch.replace(/\*/g, '').toLowerCase(); this.commandItemsFiltered = this.commandItems.filter(item => item.title.toLowerCase().startsWith(term)); this.commandScrollToActiveItem(); } else { this.commandItemsFiltered = this.commandItems.filter(item => item.default); } this.commandItemActive = this.commandItemsFiltered[0]; },
commandShowCategory(item, index){ if (index == 0) { return true; } if (typeof this.commandItemsFiltered[index - 1] === 'undefined') { return false; } return item.category != this.commandItemsFiltered[index - 1].category; },
commandCategoryCapitalize(string){ return string.charAt(0).toUpperCase() + string.slice(1); },
commandSelect(item){ if (item.disabled) { return; } this.commandItemSelected = item; if (item.action) { eval(item.action); } }
}" x-init="commandSearchItems(); $watch('commandSearch', value => commandSearchItems());" x-on:keydown.down="event.preventDefault(); commandItemActiveNext();" x-on:keydown.up="event.preventDefault(); commandItemActivePrevious();" x-on:keydown.enter="commandSelect(commandItemActive);" x-cloak data-testid="command"><div class="flex flex-col w-full h-full overflow-hidden bg-background border border-border rounded-lg shadow-md"><div class="flex items-center px-3 border-b border-border text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" stroke-linecap="round" stroke-linejoin="round" /></svg><input type="text" x-ref="commandInput" x-model="commandSearch" class="flex w-full px-2 py-3 text-sm bg-transparent border-0 rounded-md outline-hidden focus:ring-0 focus:border-0 placeholder:text-muted-foreground disabled:cursor-not-allowed disabled:opacity-50 h-11" placeholder="Type a command or search..." autocomplete="off" autocorrect="off" spellcheck="false"></div><div x-ref="commandItemsList" class="max-h-[320px] overflow-y-auto overflow-x-hidden"><template x-for="(item, index) in commandItemsFiltered" x-bind:key="'item-' + index"><div class="pb-1 space-y-1"><template x-if="commandShowCategory(item, index)"><div class="px-1 overflow-hidden text-foreground"><div class="px-2 py-1 my-1 text-xs font-medium text-muted-foreground" x-text="commandCategoryCapitalize(item.category)"></div></div></template><template x-if="(item.default &amp;&amp; commandSearchIsEmpty()) || !commandSearchIsEmpty()"><div class="px-1"><div x-bind:id="item.value + '-' + commandId" x-on:click="commandSelect(item)" x-on:mousemove="commandItemActive=item" x-bind:data-disabled="item.disabled" x-bind:class="{ 'bg-primary/10 text-foreground' : commandItemIsActive(item) }" class="relative flex cursor-default select-none items-center rounded-xs px-2 py-1.5 text-sm outline-hidden data-[disabled=true]:pointer-events-none data-[disabled=true]:opacity-50"><span x-html="item.icon"></span><span x-text="item.title"></span><template x-if="item.right"><span class="ml-auto text-xs tracking-widest text-muted-foreground" x-text="item.right"></span></template></div></div></template></div></template></div></div></div>
